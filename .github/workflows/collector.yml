name: Spotify 4-Hour Collector

on:
  schedule:
    # Corre cada 4 horas todos los días
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Cache File
        env:
          SPOTIFY_CACHE: ${{ secrets.SPOTIFY_CACHE }}
        run: |
          echo "$SPOTIFY_CACHE" > .cache
          
      - name: Run collector
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: "http://127.0.0.1:8888/callback"
        run: |
          python collect.py
          
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weekly_data.json monthly_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-recolección de historial" && git push)
