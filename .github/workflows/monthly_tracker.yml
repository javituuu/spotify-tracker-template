name: Spotify Monthly Tracker

on:
  schedule:
    # Corre el día 1 de cada mes a las 00:00 UTC (procesando el mes anterior)
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Cache File
        env:
          SPOTIFY_CACHE: ${{ secrets.SPOTIFY_CACHE }}
        run: |
          echo "$SPOTIFY_CACHE" > .cache
          
      - name: Run script
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: "http://127.0.0.1:8888/callback"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monthly.py
          
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historial_mensual.md monthly_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar historial mensual de Spotify" && git push)
